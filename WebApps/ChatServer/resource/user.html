<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #333;
        }

        /* 顶部导航栏 */
        .navbar {
            height: 50px;
            background-color: #2c2c2c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            color: white;
        }

        .app-name {
            font-size: 18px;
            font-weight: bold;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            margin: 0 10px;
            cursor: pointer;
            opacity: 0.8;
        }

        .nav-icon:hover {
            opacity: 1;
        }

        /* 主容器 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 300px;
            background-color: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        /* 搜索框 */
        .search-box {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-input {
            width: 100%;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            background-color: #f0f0f0;
            font-size: 14px;
            outline: none;
        }

        .search-input:focus {
            background-color: white;
            box-shadow: 0 0 0 1px #07c160;
        }

        /* 联系人列表 */
        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .empty-contacts {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            padding: 20px;
            text-align: center;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: #07c160;
        }

        /* 聊天区域 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f0f0f0;
        }

        /* 聊天头部 */
        .chat-header {
            height: 50px;
            background-color: white;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-weight: bold;
            color: #666;
        }

        /* 空白聊天界面 */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            padding: 20px;
            text-align: center;
        }

        .chat-icon {
            font-size: 50px;
            margin-bottom: 20px;
            color: #07c160;
        }

        /* 输入区域 */
        .input-area {
            background-color: white;
            padding: 10px 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 40px;
            font-family: inherit;
        }

        .send-btn {
            background-color: #07c160;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #06ad56;
        }

        .send-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* 底部标签栏 */
        .tab-bar {
            height: 50px;
            background-color: #2c2c2c;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaa;
            cursor: pointer;
            flex: 1;
            padding: 8px 0;
        }

        .tab-item.active {
            color: #07c160;
        }

        .tab-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .tab-label {
            font-size: 11px;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 2px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <!-- 顶部导航栏 -->
    <div class="navbar">
        <div style="display: flex; align-items: center;">
            <i class="fas fa-comment-alt" style="margin-right: 10px;"></i>
            <div class="app-name">WeChat</div>
        </div>
        <div>
            <i class="fas fa-plus nav-icon" title="添加好友"></i>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 左侧边栏 -->
        <div class="sidebar">
            <div class="search-box">
                <input type="text" class="search-input" placeholder="搜索">
            </div>
            
            <div class="contact-list">
                <div class="empty-contacts">
                    <i class="fas fa-user-friends empty-icon"></i>
                    <h3>暂无联系人</h3>
                    <p>点击右上角"+"添加好友</p>
                </div>
            </div>
        </div>

        <!-- 聊天区域 -->
        <div class="chat-area">
            <!-- 聊天头部 -->
            <div class="chat-header">
                选择一个聊天开始对话
            </div>
            
            <!-- 空白聊天界面 -->
            <div class="empty-chat">
                <i class="fas fa-comments chat-icon"></i>
                <h2>开始聊天</h2>
                <p>从左侧选择或添加好友开始聊天</p>
            </div>
            
            <!-- 输入区域 -->
            <div class="input-area">
                <textarea class="message-input" id="message-input" placeholder="选择一个联系人开始聊天..." rows="1" disabled></textarea>
                <button class="send-btn" id="send-btn" disabled>发送</button>
            </div>
        </div>
    </div>
    
    <!-- 底部标签栏 -->
    <div class="tab-bar">
        <div class="tab-item active">
            <i class="fas fa-comment-alt tab-icon"></i>
            <div class="tab-label">微信</div>
        </div>
        <div class="tab-item">
            <i class="fas fa-address-book tab-icon"></i>
            <div class="tab-label">通讯录</div>
        </div>
        <div class="tab-item">
            <i class="fas fa-compass tab-icon"></i>
            <div class="tab-label">发现</div>
        </div>
        <div class="tab-item">
            <i class="fas fa-user tab-icon"></i>
            <div class="tab-label">我</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const messageInput = document.getElementById('message-input');
            const sendBtn = document.getElementById('send-btn');
            
            // 模拟添加好友功能
            const addFriendBtn = document.querySelector('.fa-plus');
            addFriendBtn.addEventListener('click', function() {
                // 切换到搜索模式
                switchToSearchMode();
                
                // 发送POST请求获取搜索数据
                fetch('/user/search', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        action: 'get_search_ui'  // 请求搜索UI数据
                    })
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    return response.json();
                })
                .then(data => {
                    console.log('收到搜索数据:', data);
                    
                    // 如果有数据，可以更新UI
                    if (data && data.suggestedUsers) {
                        // 可以在这里显示推荐用户
                        updateSuggestedUsers(data.suggestedUsers);
                    }
                })
                .catch(error => {
                    console.error('请求失败:', error);
                    alert('搜索功能暂时不可用');
                });
            });
            
            // 切换到搜索模式
            function switchToSearchMode() {
                // 1. 修改右上角图标：+ 换成 ←
                const navIcon = document.querySelector('.fa-plus');
                navIcon.classList.remove('fa-plus');
                navIcon.classList.add('fa-arrow-left');
                navIcon.title = '返回微信';
                
                // 移除原来的点击事件，添加返回功能
                const newNavIcon = navIcon.cloneNode(true);
                navIcon.parentNode.replaceChild(newNavIcon, navIcon);
                
                newNavIcon.addEventListener('click', function() {
                    switchBackToWeChat();
                });
                
                // 2. 修改聊天头部
                const chatHeader = document.querySelector('.chat-header');
                chatHeader.textContent = '用户搜索';
                
                // 3. 修改空白聊天区域
                const emptyChat = document.querySelector('.empty-chat');
                emptyChat.innerHTML = `
                    <i class="fas fa-search chat-icon"></i>
                    <h2>搜索陌生人</h2>
                    <p>按用户名搜索并添加好友</p>
                `;
                
                // 4. 修改输入区域
                messageInput.placeholder = '按用户名进行搜索';
                messageInput.disabled = false;
                messageInput.value = '';
                messageInput.style.height = 'auto';
                
                // 5. 修改按钮
                sendBtn.textContent = '查找';
                sendBtn.disabled = true;
                
                // 重新绑定按钮点击事件
                sendBtn.onclick = function() {
                    performSearch();
                };
                
                // 6. 修改左侧边栏的微信图标
                const wechatIcon = document.querySelector('.fa-comment-alt');
                if (wechatIcon) {
                    wechatIcon.classList.remove('fa-comment-alt');
                    wechatIcon.classList.add('fa-search');
                }
                
                // 7. 添加输入监听，启用查找按钮
                messageInput.addEventListener('input', function() {
                    const searchText = this.value.trim();
                    sendBtn.disabled = searchText.length === 0;
                });
                
                // 8. 修改标题（可选）
                document.title = '微信 - 用户搜索';
                
                console.log('已切换到搜索模式');
            }
            
            // 执行搜索
            function performSearch() {
                const searchText = messageInput.value.trim();
                
                if (!searchText) {
                    alert('请输入要搜索的用户名');
                    return;
                }
                
                console.log('正在搜索用户:', searchText);
                
                // 禁用按钮，显示加载状态
                const originalText = sendBtn.textContent;
                sendBtn.textContent = '搜索中...';
                sendBtn.disabled = true;
                
                // 发送搜索请求
                fetch('/user/search/exist', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        action: 'search_user',
                        username: searchText,
                        timestamp: Date.now()
                    })
                })
                // .then(response => response.json())
                .then(response => {
                    if(response.status == 200){
                        return response.json();
                    }
                    else{
                        throw new Error('搜索失败，未知错误！');
                    }
                })
                .then(data => {
                    console.log('搜索结果:', data);
                    
                    // 恢复按钮状态
                    sendBtn.textContent = originalText;
                    sendBtn.disabled = false;
                    
                    // 处理搜索结果
                    if(!data){
                        throw new Error('服务器返回空数据');
                    } 
                    if (data.status == true) {
                        displaySearchResults([{
                            userId: data.targetId,
                            username: searchText  // 使用搜索的用户名
                        }]);
                    } else {
                        alert('搜索失败，未找到对应的用户');
                    }
                })
                .catch(error => {
                    console.error('搜索失败:', error);
                    
                    // 恢复按钮状态
                    sendBtn.textContent = originalText;
                    sendBtn.disabled = false;
                    
                    alert('搜索失败，请稍后重试');
                });
            }
            
            // 显示搜索结果
            function displaySearchResults(users) {
                const emptyChat = document.querySelector('.empty-chat');
                
                if (users.length === 0) {
                    emptyChat.innerHTML = `
                        <i class="fas fa-user-slash chat-icon"></i>
                        <h2>未找到用户</h2>
                        <p>没有找到匹配的用户名</p>
                        <button onclick="clearSearch()" style="margin-top: 20px; padding: 10px 20px; background: #07c160; color: white; border: none; border-radius: 5px; cursor: pointer;">
                            重新搜索
                        </button>
                    `;
                    return;
                }
                
                // 显示用户列表
                let usersHtml = `
                    <div style="text-align: left; width: 100%; max-width: 600px; margin: 0 auto;">
                        <h3 style="margin-bottom: 20px; color: #333;">找到 ${users.length} 个用户</h3>
                `;
                
                users.forEach((user, index) => {
                    usersHtml += `
                        <div style="display: flex; align-items: center; padding: 15px; background: white; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
                            <div style="width: 50px; height: 50px; background: #07c160; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-right: 15px;">
                                <i class="fas fa-user" style="color: white; font-size: 20px;"></i>
                            </div>
                            <div style="flex: 1;">
                                <div style="font-weight: bold; font-size: 16px; color: #333;">${user.username || '未知用户'}</div>
                                <div style="font-size: 14px; color: #666; margin-top: 5px;">ID: ${user.userId || 'N/A'}</div>
                            </div>
                            <button onclick="addFriend('${user.userId}', '${user.username}')" 
                                    style="padding: 8px 15px; background: #07c160; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px;">
                                添加好友
                            </button>
                        </div>
                    `;
                });
                
                usersHtml += `
                        <div style="margin-top: 20px; text-align: center;">
                            <button onclick="clearSearch()" style="padding: 10px 20px; background: #999; color: white; border: none; border-radius: 5px; cursor: pointer; margin-right: 10px;">
                                重新搜索
                            </button>
                            <button onclick="switchBackToWeChat()" style="padding: 10px 20px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">
                                返回微信
                            </button>
                        </div>
                    </div>
                `;
                
                emptyChat.innerHTML = usersHtml;
            }
            
            // 添加好友功能
            window.addFriend = function(userId, username) {
                if (!confirm(`确定要添加 ${username} 为好友吗？`)) {
                    return;
                }
                
                fetch('/user/search/add', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        action: 'add_friend',
                        targetUserId: userId,
                        targetUsername: username
                    })
                })
                // .then(response => response.json())
                .then(response => {
                    if(response.status == 200){
                        return response.json();
                    }
                    else{
                        throw new Error('添加失败，未知错误！');
                    }
                })
                .then(data => {
                    if (data.status == true) {
                        // alert(`已发送好友请求给 ${username}`);
                        // 可以在这里更新UI，比如显示"已发送请求"
                        alert("添加好友成功")
                    } else {
                        alert(data.message || '添加好友失败');
                    }
                })
                .catch(error => {
                    console.error('添加好友失败:', error);
                    alert('添加好友失败');
                });
            };
            
            // 清空搜索
            window.clearSearch = function() {
                messageInput.value = '';
                messageInput.focus();
                sendBtn.disabled = true;
                
                // 恢复搜索界面
                const emptyChat = document.querySelector('.empty-chat');
                emptyChat.innerHTML = `
                    <i class="fas fa-search chat-icon"></i>
                    <h2>搜索陌生人</h2>
                    <p>按用户名搜索并添加好友</p>
                `;
            };
            
            // 切换回微信模式
            function switchBackToWeChat() {
                // 1. 恢复右上角图标
                const navIcon = document.querySelector('.fa-arrow-left');
                if (navIcon) {
                    navIcon.classList.remove('fa-arrow-left');
                    navIcon.classList.add('fa-plus');
                    navIcon.title = '添加好友';
                    
                    // 移除返回事件，重新绑定搜索事件
                    const newNavIcon = navIcon.cloneNode(true);
                    navIcon.parentNode.replaceChild(newNavIcon, navIcon);
                    
                    newNavIcon.addEventListener('click', function() {
                        switchToSearchMode();
                        fetch('/user/search/add', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'get_search_ui'})
                        })
                        .then(response => response.json())
                        .then(data => {
                            console.log('收到搜索数据:', data);
                        })
                        .catch(error => {
                            console.error('请求失败:', error);
                        });
                    });
                }
                
                // 2. 恢复聊天头部
                const chatHeader = document.querySelector('.chat-header');
                chatHeader.textContent = '选择一个聊天开始对话';
                
                // 3. 恢复空白聊天区域
                const emptyChat = document.querySelector('.empty-chat');
                emptyChat.innerHTML = `
                    <i class="fas fa-comments chat-icon"></i>
                    <h2>开始聊天</h2>
                    <p>从左侧选择或添加好友开始聊天</p>
                `;
                
                // 4. 恢复输入区域
                messageInput.placeholder = '选择一个联系人开始聊天...';
                messageInput.disabled = true;
                messageInput.value = '';
                messageInput.style.height = 'auto';
                
                // 5. 恢复按钮
                sendBtn.textContent = '发送';
                sendBtn.disabled = true;
                sendBtn.onclick = null;
                
                // 6. 恢复微信图标
                const searchIcon = document.querySelector('.fa-search');
                if (searchIcon && searchIcon.closest('.navbar')) {
                    searchIcon.classList.remove('fa-search');
                    searchIcon.classList.add('fa-comment-alt');
                }
                
                // 7. 恢复标题
                document.title = '微信';
                
                console.log('已切换回微信模式');
            }
            
            // 自动调整输入框高度
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
            
            // 标签页切换
            const tabItems = document.querySelectorAll('.tab-item');
            tabItems.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabItems.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 模拟页面切换
                    const tabLabel = this.querySelector('.tab-label').textContent;
                    alert(`切换到 ${tabLabel} 页面`);
                });
            });
            
            // 搜索框功能
            const searchInput = document.querySelector('.search-input');
            searchInput.addEventListener('focus', function() {
                alert('搜索功能（模拟）\n这里可以集成实际的好友搜索逻辑');
            });
            
            // 模拟消息发送（仅当有联系人时启用）
            const originalSendBtnClick = function() {
                if (!sendBtn.disabled) {
                    const message = messageInput.value.trim();
                    if (message) {
                        alert(`发送消息：${message}\n（此处需要选中联系人才可发送）`);
                        messageInput.value = '';
                        messageInput.style.height = 'auto';
                    }
                }
            };
            
            // 按Enter键发送消息
            messageInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!sendBtn.disabled) {
                        sendBtn.click();
                    }
                }
            });
            
            console.log('微信界面已加载');
            console.log('当前界面：简洁空白版，无联系人，无聊天记录');
        });
    </script>
</body>

</html>
